services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rfp}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    stop_grace_period: 30s
  redis:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    stop_grace_period: 30s
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports: ["127.0.0.1:6333:6333"]
    # Fresh volume: storage written by 1.13.x is not migrated across non-consecutive minors.
    volumes: ["qdrant_data_v1_19:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 15
    stop_grace_period: 30s
  migrate:
    build: .
    image: rfp-backend:local
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: .
    image: rfp-backend:local
    env_file: .env
    init: true
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - model_cache:/app/model-cache
      - ./data/assessment:/data/assessment:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=15)"]
      interval: 20s
      timeout: 16s
      retries: 3
    stop_grace_period: 30s
  worker:
    image: rfp-backend:local
    build: .
    env_file: .env
    init: true
    command: ["celery", "-A", "rfp.workers.entrypoint:app", "worker", "--loglevel=WARNING", "--concurrency=2", "--hostname=worker@%h"]
    volumes: ["model_cache:/app/model-cache"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A rfp.workers.entrypoint:app inspect ping --destination worker@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
    stop_grace_period: 75s
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  qdrant_data_v1_19:
  model_cache:
